name: Generate Android Project Structure, Custom Icon & Gradle Wrapper
        run: |
          mkdir -p app/src/main/java/in/mehf/smarthub
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets

          if [ -f "MainActivity.java" ]; then
            cp MainActivity.java app/src/main/java/in/mehf/smarthub/MainActivity.java
          fi
          
          # FCM Service class copy karein agar banai hai
          if [ -f "MyFirebaseMessagingService.java" ]; then
            cp MyFirebaseMessagingService.java app/src/main/java/in/mehf/smarthub/MyFirebaseMessagingService.java
          fi

          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi
          if [ -f "chat.html" ]; then
            cp chat.html app/src/main/assets/chat.html
          fi

          # 🔥 Firebase configuration file copy karein
          if [ -f "google-services.json" ]; then
            cp google-services.json app/google-services.json
          fi

          # Check if user uploaded launchericon-72x72.png or icon.png
          ICON_FILE=""
          if [ -f "launchericon-72x72.png" ]; then
            ICON_FILE="launchericon-72x72.png"
          elif [ -f "icon.png" ]; then
            ICON_FILE="icon.png"
          elif [ -f "ic_launcher.png" ]; then
            ICON_FILE="ic_launcher.png"
          fi

          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" app/src/main/res/drawable/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            # Fallback Golden Seal Vector Drawable
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#C67D0A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00000000" android:strokeColor="#3E2000" android:strokeWidth="4" android:pathData="M54,54m-44,0a44,44 0,1 1,88 0a44,44 0,1 1,-88 0"/>
              <path android:fillColor="#00000000" android:strokeColor="#3E2000" android:strokeWidth="2" android:pathData="M54,54m-32,0a32,32 0,1 1,64 0a32,32 0,1 1,-64 0"/>
              <path android:fillColor="#3E2000" android:pathData="M36,48 L54,42 L72,48 L72,56 L54,50 L36,56 Z"/>
              <path android:fillColor="#3E2000" android:pathData="M52,24 h4 v22 h-4 z"/>
          </vector>
          EOF
          fi

          echo "sdk.dir=$HOME/android-sdk" > local.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MehFoundation"
          include ':app'
          EOF

          # 🔥 Root build.gradle mein Google Services plugin version joda gaya hai
          cat << 'GradleEOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'com.google.gms.google-services' version '4.4.1' apply false
          }
          GradleEOF

          # 🔥 App-level build.gradle generate karein jisme FCM dependencies hongi
          mkdir -p app
          cat << 'AppBuildEOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'in.mehf.smarthub'
              compileSdk 34

              defaultConfig {
                  applicationId "in.mehf.smarthub"
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName "2.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:32.8.1')
              implementation 'com.google.firebase:firebase-messaging'
          }
          AppBuildEOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Meh foundation</string>
          </resources>
          EOF
