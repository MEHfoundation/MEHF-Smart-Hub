plugins {
    id 'com.android.application'
    // 1. Google Services plugin yahan add karein (Firebase ke liye zaroori hai)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.mehf.smsgateway'
    compileSdk 34

    defaultConfig {
        applicationId "com.mehf.smsgateway"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 2. Firebase BOM aur Cloud Messaging dependency jodein
    implementation platform('com.google.firebase:firebase-bom:32.8.1')
    implementation 'com.google.firebase:firebase-messaging'
}
