plugins {
    id 'com.android.application'
}

android {
    namespace 'in.mehf.smarthub'
    compileSdk 34

    defaultConfig {
        applicationId "in.mehf.smarthub"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
